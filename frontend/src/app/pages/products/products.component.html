<div class="products-page">
    <h1 class="products-title">Our Products</h1>
    <p class="products-subtitle">
        Browse our latest products and find what you love. Free shipping on orders over $50!
    </p>
    <div class="add-product-link" style="margin: 16px 0;">
        <a routerLink="/admin/products/new" mat-button color="accent">Add New Product</a>
    </div>
    <div class="products-container">
        <mat-card *ngFor="let product of products" class="product-card">
        <img mat-card-image [src]="product.image_url" alt="{{ product.name }}">
        <mat-card-header>
            <mat-card-title>{{ product.name }}</mat-card-title>
            <mat-card-subtitle>{{ product.category }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p class="description">{{ product.description }}</p>
            <p class="price">${{ product.price }}</p>
            <p [ngClass]="{
                'in-stock': product.stock > 10,
                'low-stock': product.stock > 0 && product.stock <= 10,
                'out-of-stock': product.stock === 0
            }"
            >
                Stock: {{ product.stock }}
            </p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" [routerLink]="['/products/edit', product.id]">
                Edit Product
            </button>
            <button mat-raised-button color="warn" (click)="deleteProduct(product.id)">
                Delete
            </button>
            <button mat-raised-button color="primary" class="add-to-cart-btn" (click)="addToCart(product)">Add to Cart</button>
        </mat-card-actions>
        </mat-card>
    </div>
</div>
